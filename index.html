<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeChat</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="app-brand">
                    <i class="fa-solid fa-comments"></i>
                    <h2>AnimeChat</h2>
                </div>
                <button class="mobile-close-btn" id="mobileCloseBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search characters...">
            </div>

            <div class="contact-list" id="contactList">
                <!-- Contacts populated dynamically via JS -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area" id="chatArea">
            <!-- Chat Header -->
            <header class="chat-header">
                <div class="chat-header-user">
                    <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fa-solid fa-bars"></i></button>
                    <div class="avatar-container">
                        <img id="activeAvatar" src="" alt="Avatar">
                        <span class="status-indicator"></span>
                    </div>
                    <div class="user-info">
                        <h3 id="activeName">Select a chat</h3>
                        <p id="activeStatus">Online</p>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button class="action-btn" id="audioCallBtn" title="Audio Call"><i class="fa-solid fa-phone"></i></button>
                    <button class="action-btn" id="videoCallBtn" title="Video Call"><i class="fa-solid fa-video"></i></button>
                </div>
            </header>

            <!-- Message History -->
            <div class="message-container" id="messageContainer">
                <div class="empty-chat-state">
                    <i class="fa-regular fa-comment-dots"></i>
                    <p>Choose an anime character from the sidebar to start chatting!</p>
                </div>
            </div>

            <!-- Message Input Form -->
            <form class="message-input-form" id="messageForm">
                <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" disabled>
                <button type="submit" id="sendBtn" disabled><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </main>
    </div>

    <!-- Call Overlay Modal -->
    <div class="call-modal" id="callModal">
        <div class="call-modal-content">
            <div class="call-avatar-container">
                <img id="callAvatar" src="" alt="Calling...">
                <div class="pulse-ring"></div>
            </div>
            <h3 id="callName">Character Name</h3>
            <p id="callStatus">Calling...</p>
            <div class="call-timer" id="callTimer">00:00</div>
            
            <div class="call-controls">
                <button class="call-control-btn mute-btn" id="muteBtn" title="Mute"><i class="fa-solid fa-microphone"></i></button>
                <button class="call-control-btn end-call-btn" id="endCallBtn" title="End Call"><i class="fa-solid fa-phone-slash"></i></button>
                <button class="call-control-btn video-toggle-btn" id="videoToggleBtn" title="Toggle Video" style="display:none;"><i class="fa-solid fa-video"></i></button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
